<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock Test Coverage</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  :root {
    --bg: var(--ground); --panel: var(--surface); --line: var(--rule); --dim: var(--muted);
    --bad: var(--error); --mono: var(--font-mono); --no: #A9B1AD; --passed: #DDF1E4;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --no: #4A5752; --passed: #1C3A2A; } }
  :root[data-theme="dark"] { --no: #4A5752; --passed: #1C3A2A; }
  body > .site { margin: -12px -16px 12px; padding-inline: 16px; }
  body { margin: 0; padding: 12px 16px; background: var(--bg); color: var(--ink); font: 13px/1.4 var(--font-sans); }
  h1 { font-size: 16px; margin: 0 0 4px; }
  a { color: inherit; }
  .sub { color: var(--dim); font-size: 12px; }
  .note { color: var(--warn); margin: 4px 0; }
  .legend span { margin-right: 14px; }
  .sw { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 4px; }
  table { border-collapse: collapse; margin-top: 10px; font-size: 12.5px; }
  td:first-child { white-space: nowrap; }
  td, th { padding: 4px 10px; border-bottom: 1px solid var(--line); text-align: left; }
  td.num { text-align: right; font-family: var(--mono); }
  .bar { width: 120px; height: 7px; background: var(--no); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ok); }
  svg text { font-family: var(--mono); fill: var(--ink); }
  svg .dim { fill: var(--dim); }
  #graph { overflow: auto; margin-top: 4px; }
  .muxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px; }
  .mux.passed { background: var(--passed); }
  .mux { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; font: 11px var(--mono); }
  .chip { display: inline-block; margin: 2px 3px 0 0; padding: 0 5px; border-radius: 4px; border: 1px solid var(--no); color: var(--dim); font-size: 10.5px; }
  .chip.ok { border-color: var(--ok); color: var(--ok); }
  .chip.bad { border-color: var(--bad); color: var(--bad); font-weight: 700; }
  .chip.sel { box-shadow: inset 0 -2px 0 currentColor; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
</head>
<body data-page="clocks">
<nav class="site" aria-label="modm-data pages"></nav>
<script type="module" src="../shared/site.js"></script>
<div id="page"></div>
<script type="module">
import * as py from "./py.js";
import {fmtHz} from "./model.js";

const page = document.getElementById("page");
const coverage = await (await fetch("data/coverage.json")).json();
const devices = await (await fetch("data/devices.json")).json();
const board = new URLSearchParams(location.search).get("board");
const key = (e) => `${e[0]}=${typeof e[1] === "number" ? Number(e[1]) : e[1]}`;
const count = (b) => [b.covered.length, b.covered.length + b.uncovered.length];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

if (!board || !coverage[board]) index(); else graph(board, coverage[board]);

function index() {
  let rows = "", all = [0, 0], allNodes = [0, 0];
  for (const [name, b] of Object.entries(coverage)) {
    const [c, t] = count(b), [nc, nt] = [b.nodes.length, b.nodes_total];
    all = [all[0] + c, all[1] + t];
    allNodes = [allNodes[0] + nc, allNodes[1] + nt];
    rows += `<tr><td><a href="?board=${name}">${name}</a></td><td class="sub">${b.device}</td>
      <td class="num">${nc}/${nt}</td><td class="num">${Math.round(100 * nc / nt)}%</td><td><div class="bar"><i style="width:${100 * nc / nt}%"></i></div></td>
      <td class="num">${c}/${t}</td><td class="num">${Math.round(100 * c / t)}%</td><td><div class="bar"><i style="width:${100 * c / t}%"></i></div></td>
      <td class="num">${b.failed.length ? `<span style="color:var(--bad)">${b.failed.length} failed</span>` : ""}</td>
      <td class="sub">${esc(b.note)}</td></tr>`;
  }
  page.innerHTML = `<h1>Clock graph test coverage</h1><div class="sub">The CubeMX clock graph measured by the hardware clock meter,
    ${Object.keys(coverage).length} boards. Nodes: ${allNodes[0]}/${allNodes[1]} had a measured signal pass through them.
    Config: ${all[0]}/${all[1]} mux inputs, divider factors and range min/mid/max tested.</div>
    <table><tr><th>board</th><th>device</th><th>nodes</th><th></th><th></th><th>config</th><th></th><th></th><th></th><th>notes</th></tr>${rows}</table>`;
}

function parse(config) {
  const out = {};
  for (const part of config.split(",")) {
    const [k, v] = part.split("=").map((s) => s.trim());
    if (k) out[k] = v;
  }
  return out;
}

async function graph(name, b) {
  const text = await (await fetch(`data/tree/${devices[b.device]}.json`)).text();
  const tree = JSON.parse(text);
  let result = {};
  try { await py.load(b.device, text, null); result = await py.evaluate(parse(b.config), null); } catch (e) { console.warn(e); }
  const state = {}, passed = new Set(b.nodes);
  for (const e of b.uncovered) state[key(e)] = "no";
  for (const e of b.covered) state[key(e)] = "ok";
  const why = {};
  for (const e of b.failed) { state[key(e)] = "bad"; if (e[2]) why[key(e)] = e[2]; }
  // Per node: the tested values in order, for the annotation line
  const tested = {};
  for (const e of [...b.covered, ...b.uncovered]) (tested[e[0]] ??= []).push(e[1]);
  // A kernel clock mux that only feeds outputs and peripherals becomes a card with its inputs as chips,
  // its wires would cross the whole graph. The rest stays a graph.
  const all = tree.nodes;
  const leafMux = (id) => all[id].kind === "mux" && all[id].inputs.length > 1 &&
    all[id].outputs.every((o) => all[o] && ["output", "peripheral"].includes(all[o].kind) && all[o].outputs.every((p) => all[p]?.kind === "peripheral"));
  const cards = Object.keys(all).filter(leafMux).sort();
  const hidden = new Set(cards.flatMap((id) => [id, ...all[id].outputs.filter((o) => all[o].inputs.length === 1)]));
  const nodes = Object.fromEntries(Object.entries(all).filter(([id, n]) => n.kind !== "peripheral" && !hidden.has(id)));
  const leafOut = (id) => nodes[id].kind === "output" && !nodes[id].outputs.some((o) => nodes[o]);
  const color = (s) => ({ok: "var(--ok)", no: "var(--no)", bad: "var(--bad)"}[s] ?? "var(--line)");

  const W = 156, g = new dagre.graphlib.Graph();
  g.setGraph({rankdir: "LR", nodesep: 4, ranksep: 28, marginx: 6, marginy: 6});
  g.setDefaultEdgeLabel(() => ({}));
  for (const [id, n] of Object.entries(nodes)) {
    const values = (tested[id] ?? []).filter(() => n.kind !== "mux");
    g.setNode(id, {width: W, height: values.length ? 42 : 28});
  }
  for (const [id, n] of Object.entries(nodes)) for (const i of n.inputs) if (nodes[i.from]) g.setEdge(i.from, id);
  dagre.layout(g);

  let edges = "", boxes = "";
  for (const [id, n] of Object.entries(nodes)) {
    const to = g.node(id), now = result[id]?.setting;
    for (const i of n.inputs) {
      if (!nodes[i.from]) continue;
      const from = g.node(i.from);
      const s = n.kind === "mux" ? state[`${id}=${i.from}`] : null;
      const active = n.kind !== "mux" || now === i.macro || now === i.from;
      const x1 = from.x + W / 2, y1 = from.y, x2 = to.x - W / 2, y2 = to.y, m = (x1 + x2) / 2;
      const stroke = s ? color(s) : "var(--line)";
      edges += `<path d="M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}" fill="none" stroke="${stroke}"
        stroke-width="${s === "ok" || s === "bad" ? 2.2 : active ? 1.4 : 1}" ${s === "no" ? 'stroke-dasharray="4 3"' : ""}>
        <title>${esc(i.from)} → ${esc(id)}${s ? `: ${{ok: "tested, passed", no: "not tested", bad: "tested, FAILED"}[s]}` : ""}${why[`${id}=${i.from}`] ? `, ${esc(why[`${id}=${i.from}`])}` : ""}</title></path>`;
    }
    // Border: all covered, partly, nothing, or failed; nodes without test edges stay neutral
    const own = (tested[id] ?? []).map((v) => state[`${id}=${typeof v === "number" ? Number(v) : v}`]);
    const border = own.includes("bad") ? "var(--bad)" : !own.length ? "var(--line)" : own.every((s) => s === "ok") ? "var(--ok)"
      : own.some((s) => s === "ok") ? "var(--warn)" : "var(--no)";
    const suspect = b.suspect === id;
    const x = to.x - W / 2, y = to.y - to.height / 2;
    const label = id.replace(/Devisor/g, "Divider");
    let chips = "";
    if (n.kind !== "mux" && tested[id]) {
      let cx = 0;
      for (const v of tested[id]) {
        const text = typeof v === "number" ? `${n.kind === "mul" ? "×" : "÷"}${Number(v)}` : v;
        chips += `<tspan x="${x + 6 + cx}" fill="${color(state[`${id}=${typeof v === "number" ? Number(v) : v}`])}">${esc(text)}</tspan>`;
        cx += text.length * 5.4 + 4;
      }
    }
    const covered = own.filter((s) => s === "ok").length;
    boxes += `<g><rect x="${x}" y="${y}" width="${W}" height="${to.height}" rx="5" fill="${passed.has(id) ? "var(--passed)" : "var(--panel)"}" stroke="${suspect ? "var(--warn)" : border}"
        stroke-width="${own.length || suspect ? 1.8 : 1}"/>
      <title>${esc(label)} (${n.kind})${passed.has(id) ? "\nmeasured signal passed through" : ""}${own.length ? `\n${covered}/${own.length} tested` : ""}${suspect ? "\nmeasured off: board/chip oscillator, see note" : ""}</title>
      <text x="${x + 6}" y="${y + 13}" font-size="10.5" font-weight="600">${esc(label.length > 24 ? label.slice(0, 23) + "…" : label)}</text>
      <text x="${x + W - 6}" y="${y + 13}" font-size="9" text-anchor="end" class="dim">${own.length ? `${covered}/${own.length}` : ""}</text>
      <text x="${x + 6}" y="${y + 24}" font-size="9.5" class="dim">${esc(fmtHz(result[id]?.freq))}</text>
      ${chips ? `<text y="${y + 36}" font-size="9">${chips}</text>` : ""}</g>`;
  }
  const {width, height} = g.graph();
  let cardHtml = "";
  for (const id of cards) {
    const n = all[id], now = result[id]?.setting;
    const chips = n.inputs.map((i) => {
      const st = state[`${id}=${i.from}`], sel = now === i.macro || now === i.from;
      return `<span class="chip ${st ?? ""}${sel ? " sel" : ""}" title="${esc(i.from)}${sel ? " (board config)" : ""}: ${
        {ok: "tested, passed", no: "not tested", bad: "tested, FAILED"}[st] ?? "no test edge"}${why[`${id}=${i.from}`] ? `, ${why[`${id}=${i.from}`]}` : ""}${b.suspect === i.from ? ", oscillator off on this board" : ""}">${esc(i.from.replace(/Devisor/g, "Divider"))}${b.suspect === i.from ? " ⚠" : ""}${why[`${id}=${i.from}`] ? " ✗" : ""}</span>`;
    }).join("");
    const periphs = n.outputs.flatMap((o) => all[o].kind === "peripheral" ? [o] : all[o].outputs).filter((p) => all[p]).join(" ");
    const own = n.inputs.map((i) => state[`${id}=${i.from}`]).filter(Boolean);
    cardHtml += `<div class="mux${passed.has(id) ? " passed" : ""}"><b>${esc(id)}</b> <span class="sub">${own.filter((x) => x === "ok").length}/${own.length} · ${esc(fmtHz(result[id]?.freq))}</span>
      <div class="sub" style="font-size:10px">${esc(periphs)}</div><div>${chips}</div></div>`;
  }
  const [c, t] = count(b);
  page.innerHTML = `<div class="sub"><a href="?">← all boards</a></div>
    <h1>${name} <span class="sub">${b.device} · nodes ${b.nodes.length}/${b.nodes_total} (${Math.round(100 * b.nodes.length / b.nodes_total)}%)
      · config ${c}/${t} (${Math.round(100 * c / t)}%) · ${b.cases} cases</span></h1>
    <div class="sub" style="overflow-wrap:anywhere">config: <code>${esc(b.config.replace(/,/g, ", "))}</code></div>${b.note ? `<div class="note">${esc(b.note)}</div>` : ""}
    <div class="legend sub"><span><i class="sw" style="background:var(--ok)"></i>tested, passed</span>
      <span><i class="sw" style="background:var(--no)"></i>not tested</span><span><i class="sw" style="background:var(--bad)"></i>tested, failed</span>
      <span><i class="sw" style="background:var(--warn)"></i>partly tested / oscillator off on this board</span>
      <span><i class="sw" style="background:var(--passed);outline:1px solid var(--line)"></i>node fill: a measured signal passed through</span>
      <span>mux inputs color the wires, divider and parameter values are listed under the node, frequencies are the board config</span></div>
    <h2 class="sub" style="margin:14px 0 4px">Clock graph</h2>
    <div id="graph"><svg viewBox="0 0 ${width} ${height}" style="width:100%;max-width:${width * 1.4}px;height:auto">${edges}${boxes}</svg></div>
    <h2 class="sub" style="margin:14px 0 4px">Kernel clock muxes <span style="font-weight:400">(underlined: board config)</span></h2><div class="muxes">${cardHtml}</div>`;
}
</script>
</body>
</html>
