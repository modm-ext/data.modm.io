<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVD Register Explorer</title>
<meta name="description" content="Pick or open a CMSIS-SVD file and browse peripherals, registers, bit fields and enumerated values as a table or as a zoomable address space map.">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="register-view.css">
<link rel="stylesheet" href="table-view.css">
<link rel="stylesheet" href="map-view.css">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>

<body class="app" data-page="svd">
<nav class="site" aria-label="modm-data pages"></nav>

<header class="top">
  <div>
    <h1>SVD Registers</h1>
    <p class="sub file-line" id="file-line">No file loaded</p>
  </div>
  <div class="open">
    <input id="file-input" class="visually-hidden" type="file" accept=".svd,.xml,text/xml,application/xml">
    <label class="btn primary" for="file-input">Open SVD file</label>
    <span class="hint">or drop one anywhere on the page</span>
  </div>
</header>

<div class="layout">
<nav class="menu" aria-labelledby="menu-title">
  <div class="menu-head">
    <h2 id="menu-title">SVD files</h2>
    <span class="menu-count" id="menu-count"></span>
  </div>
  <label for="menu-query" class="visually-hidden">Filter SVD files by regular expression</label>
  <div class="search" id="menu-search">
    <span class="delim" aria-hidden="true">/</span>
    <input id="menu-query" type="search" spellcheck="false" autocomplete="off" placeholder="f4|h7.*cm7">
    <span class="delim" aria-hidden="true">/i</span>
  </div>
  <ul class="menu-list" id="menu-list"></ul>
</nav>

<main class="main">
<section class="tools" aria-label="View and filter">
  <div class="tabs" role="tablist" aria-label="View" id="tabs">
    <button class="tab" role="tab" type="button" id="tab-table" aria-controls="panel-table" aria-selected="true">Table</button>
    <button class="tab" role="tab" type="button" id="tab-map" aria-controls="panel-map" aria-selected="false" tabindex="-1">Map</button>
  </div>
  <label for="query" class="visually-hidden">Filter by regular expression</label>
  <div class="search" id="search">
    <span class="delim" aria-hidden="true">/</span>
    <input id="query" type="search" spellcheck="false" autocomplete="off"
           placeholder="^USART\d+$ or CR1\.(RE|TE)">
    <span class="delim" id="flags" aria-hidden="true">/i</span>
  </div>
  <label class="check"><input type="checkbox" id="scope-desc"> Descriptions</label>
  <label class="check"><input type="checkbox" id="match-case"> Match case</label>
  <div class="actions" id="table-actions">
    <button class="btn" type="button" id="expand-all">Expand all</button>
    <button class="btn" type="button" id="collapse-all">Collapse all</button>
  </div>
  <p class="status" id="status" role="status"></p>
</section>

<p class="message" id="message" role="alert" hidden></p>

<section class="view" id="panel-table" role="tabpanel" aria-labelledby="tab-table">
  <div class="table-wrap" id="table-wrap"></div>
  <p class="more" id="more" hidden></p>
</section>

<section class="view" id="panel-map" role="tabpanel" aria-labelledby="tab-map" hidden>
  <div class="map-bar">
    <nav class="crumbs" id="crumbs" aria-label="Map location"></nav>
    <div class="map-controls">
      <label class="check"><input type="checkbox" id="map-dense"> Hide empty rows</label>
      <label class="check">Words per row
        <select id="map-row">
          <option value="16">4</option>
          <option value="32">8</option>
          <option value="64" selected>16</option>
          <option value="128">32</option>
          <option value="256">64</option>
        </select>
      </label>
      <div class="actions">
        <button class="btn icon" type="button" id="zoom-out" aria-label="Zoom out">−</button>
        <button class="btn icon" type="button" id="zoom-in" aria-label="Zoom in">+</button>
        <button class="btn" type="button" id="zoom-fit">Fit width</button>
      </div>
    </div>
  </div>
  <div id="map-frame">
    <aside class="map-card" id="map-card" aria-live="polite" hidden></aside>
  </div>
  <div class="map-foot">
    <p class="map-hint" id="map-hint">Scroll to move · Ctrl or ⌘ + scroll, or pinch, to zoom · Double-click to zoom in · Click for details</p>
    <div class="legend">
      <span><i class="key key-rw"></i>read-write</span>
      <span><i class="key key-ro"></i>read-only</span>
      <span><i class="key key-wo"></i>write-only</span>
      <span><i class="key key-free"></i>unused</span>
    </div>
  </div>
</section>
</main>
</div>

<div class="drop" id="drop" hidden><div>Drop the SVD file to open it</div></div>

<!-- The built-in example, shown without a file in the URL -->
<script type="text/plain" id="example-svd"><?xml version="1.0" encoding="utf-8"?>
<device schemaVersion="1.3">
  <vendor>Example</vendor>
  <name>EXAMPLE_MCU</name>
  <version>1.0</version>
  <description>Example device with a few typical peripherals</description>
  <addressUnitBits>8</addressUnitBits>
  <width>32</width>
  <size>32</size>
  <access>read-write</access>
  <resetValue>0x00000000</resetValue>
  <resetMask>0xFFFFFFFF</resetMask>
  <peripherals>
    <peripheral>
      <name>TIM2</name>
      <description>General-purpose timer</description>
      <groupName>TIM</groupName>
      <baseAddress>0x40000000</baseAddress>
      <interrupt><name>TIM2</name><description>TIM2 global interrupt</description><value>28</value></interrupt>
      <registers>
        <register>
          <name>CR1</name><description>Control register 1</description><addressOffset>0x00</addressOffset>
          <fields>
            <field><name>CEN</name><description>Counter enable</description><bitOffset>0</bitOffset><bitWidth>1</bitWidth></field>
            <field><name>UDIS</name><description>Update disable</description><bitOffset>1</bitOffset><bitWidth>1</bitWidth></field>
            <field><name>URS</name><description>Update request source</description><bitOffset>2</bitOffset><bitWidth>1</bitWidth></field>
            <field><name>OPM</name><description>One-pulse mode</description><bitOffset>3</bitOffset><bitWidth>1</bitWidth></field>
            <field><name>DIR</name><description>Direction</description><bitOffset>4</bitOffset><bitWidth>1</bitWidth>
              <enumeratedValues>
                <enumeratedValue><name>UP</name><description>Counter used as upcounter</description><value>0</value></enumeratedValue>
                <enumeratedValue><name>DOWN</name><description>Counter used as downcounter</description><value>1</value></enumeratedValue>
              </enumeratedValues>
            </field>
            <field><name>CMS</name><description>Center-aligned mode selection</description><bitRange>[6:5]</bitRange>
              <enumeratedValues>
                <enumeratedValue><name>EDGE</name><description>Edge-aligned mode</description><value>0b00</value></enumeratedValue>
                <enumeratedValue><name>CENTER_1</name><description>Center-aligned mode 1</description><value>0b01</value></enumeratedValue>
                <enumeratedValue><name>CENTER_2</name><description>Center-aligned mode 2</description><value>0b10</value></enumeratedValue>
                <enumeratedValue><name>CENTER_3</name><description>Center-aligned mode 3</description><value>0b11</value></enumeratedValue>
              </enumeratedValues>
            </field>
            <field><name>ARPE</name><description>Auto-reload preload enable</description><bitOffset>7</bitOffset><bitWidth>1</bitWidth></field>
          </fields>
        </register>
        <register>
          <name>DIER</name><description>DMA and interrupt enable register</description><addressOffset>0x0C</addressOffset>
          <fields>
            <field><name>UIE</name><description>Update interrupt enable</description><bitOffset>0</bitOffset><bitWidth>1</bitWidth></field>
            <field><dim>4</dim><dimIncrement>1</dimIncrement><dimIndex>1-4</dimIndex><name>CC%sIE</name><description>Capture/compare interrupt enable</description><bitOffset>1</bitOffset><bitWidth>1</bitWidth></field>
          </fields>
        </register>
        <register>
          <name>SR</name><description>Status register</description><addressOffset>0x10</addressOffset>
          <fields>
            <field><name>UIF</name><description>Update interrupt flag</description><bitOffset>0</bitOffset><bitWidth>1</bitWidth><modifiedWriteValues>zeroToClear</modifiedWriteValues></field>
            <field><dim>4</dim><dimIncrement>1</dimIncrement><dimIndex>1-4</dimIndex><name>CC%sIF</name><description>Capture/compare interrupt flag</description><bitOffset>1</bitOffset><bitWidth>1</bitWidth><modifiedWriteValues>zeroToClear</modifiedWriteValues></field>
          </fields>
        </register>
        <register>
          <name>CNT</name><description>Counter</description><addressOffset>0x24</addressOffset>
          <fields><field><name>CNT</name><description>Counter value</description><bitOffset>0</bitOffset><bitWidth>32</bitWidth></field></fields>
        </register>
        <register>
          <name>ARR</name><description>Auto-reload register</description><addressOffset>0x2C</addressOffset><resetValue>0xFFFFFFFF</resetValue>
          <fields><field><name>ARR</name><description>Auto-reload value</description><bitOffset>0</bitOffset><bitWidth>32</bitWidth></field></fields>
        </register>
        <register>
          <dim>4</dim><dimIncrement>4</dimIncrement>
          <name>CCR[%s]</name><description>Capture/compare register</description><addressOffset>0x34</addressOffset>
          <fields><field><name>CCR</name><description>Capture/compare value</description><bitOffset>0</bitOffset><bitWidth>32</bitWidth></field></fields>
        </register>
      </registers>
    </peripheral>
    <peripheral>
      <name>USART1</name>
      <description>Universal synchronous asynchronous receiver transmitter</description>
      <groupName>USART</groupName>
      <baseAddress>0x40013800</baseAddress>
      <interrupt><name>USART1</name><description>USART1 global interrupt</description><value>37</value></interrupt>
      <registers>
        <register>
          <name>CR1</name><description>Control register 1</description><addressOffset>0x00</addressOffset>
          <fields>
            <field><name>UE</name><description>USART enable</description><bitOffset>0</bitOffset><bitWidth>1</bitWidth></field>
            <field><name>RE</name><description>Receiver enable</description><bitOffset>2</bitOffset><bitWidth>1</bitWidth></field>
            <field><name>TE</name><description>Transmitter enable</description><bitOffset>3</bitOffset><bitWidth>1</bitWidth></field>
            <field><name>RXNEIE</name><description>RXNE interrupt enable</description><bitOffset>5</bitOffset><bitWidth>1</bitWidth></field>
            <field><name>PS</name><description>Parity selection</description><bitOffset>9</bitOffset><bitWidth>1</bitWidth>
              <enumeratedValues>
                <enumeratedValue><name>EVEN</name><description>Even parity</description><value>0</value></enumeratedValue>
                <enumeratedValue><name>ODD</name><description>Odd parity</description><value>1</value></enumeratedValue>
              </enumeratedValues>
            </field>
            <field><name>PCE</name><description>Parity control enable</description><bitOffset>10</bitOffset><bitWidth>1</bitWidth></field>
            <field><name>M0</name><description>Word length, bit 0</description><lsb>12</lsb><msb>12</msb></field>
            <field><name>OVER8</name><description>Oversampling mode</description><bitRange>[15:15]</bitRange>
              <enumeratedValues>
                <enumeratedValue><name>OVERSAMPLING_16</name><description>Oversampling by 16</description><value>0</value></enumeratedValue>
                <enumeratedValue><name>OVERSAMPLING_8</name><description>Oversampling by 8</description><value>1</value></enumeratedValue>
              </enumeratedValues>
            </field>
          </fields>
        </register>
        <register>
          <name>BRR</name><description>Baud rate register</description><addressOffset>0x0C</addressOffset>
          <fields><field><name>BRR</name><description>Baud rate divider</description><bitOffset>0</bitOffset><bitWidth>16</bitWidth></field></fields>
        </register>
        <register>
          <name>ISR</name><description>Interrupt and status register</description><addressOffset>0x1C</addressOffset>
          <access>read-only</access><resetValue>0x000000C0</resetValue>
          <fields>
            <field><name>ORE</name><description>Overrun error</description><bitOffset>3</bitOffset><bitWidth>1</bitWidth></field>
            <field><name>RXNE</name><description>Read data register not empty</description><bitOffset>5</bitOffset><bitWidth>1</bitWidth></field>
            <field><name>TC</name><description>Transmission complete</description><bitOffset>6</bitOffset><bitWidth>1</bitWidth></field>
            <field><name>TXE</name><description>Transmit data register empty</description><bitOffset>7</bitOffset><bitWidth>1</bitWidth></field>
          </fields>
        </register>
        <register>
          <name>ICR</name><description>Interrupt flag clear register</description><addressOffset>0x20</addressOffset><access>write-only</access>
          <fields>
            <field><name>ORECF</name><description>Overrun error clear flag</description><bitOffset>3</bitOffset><bitWidth>1</bitWidth><modifiedWriteValues>oneToClear</modifiedWriteValues></field>
            <field><name>TCCF</name><description>Transmission complete clear flag</description><bitOffset>6</bitOffset><bitWidth>1</bitWidth><modifiedWriteValues>oneToClear</modifiedWriteValues></field>
          </fields>
        </register>
        <register>
          <name>RDR</name><description>Receive data register</description><addressOffset>0x24</addressOffset><access>read-only</access>
          <fields><field><name>RDR</name><description>Receive data value</description><bitOffset>0</bitOffset><bitWidth>9</bitWidth></field></fields>
        </register>
        <register>
          <name>TDR</name><description>Transmit data register</description><addressOffset>0x28</addressOffset>
          <fields><field><name>TDR</name><description>Transmit data value</description><bitOffset>0</bitOffset><bitWidth>9</bitWidth></field></fields>
        </register>
      </registers>
    </peripheral>
    <peripheral>
      <name>GPIOA</name>
      <description>General-purpose I/O port A</description>
      <groupName>GPIO</groupName>
      <baseAddress>0x48000000</baseAddress>
      <registers>
        <register>
          <name>MODER</name><description>Port mode register</description><addressOffset>0x00</addressOffset><resetValue>0xABFFFFFF</resetValue>
          <fields>
            <field><dim>16</dim><dimIncrement>2</dimIncrement><name>MODE%s</name><description>Pin mode</description><bitOffset>0</bitOffset><bitWidth>2</bitWidth>
              <enumeratedValues>
                <enumeratedValue><name>INPUT</name><description>Input mode</description><value>0</value></enumeratedValue>
                <enumeratedValue><name>OUTPUT</name><description>General-purpose output mode</description><value>1</value></enumeratedValue>
                <enumeratedValue><name>ALTERNATE</name><description>Alternate function mode</description><value>2</value></enumeratedValue>
                <enumeratedValue><name>ANALOG</name><description>Analog mode</description><value>3</value></enumeratedValue>
              </enumeratedValues>
            </field>
          </fields>
        </register>
        <register>
          <name>IDR</name><description>Port input data register</description><addressOffset>0x10</addressOffset><access>read-only</access>
          <fields><field><dim>16</dim><dimIncrement>1</dimIncrement><name>ID%s</name><description>Port input data</description><bitOffset>0</bitOffset><bitWidth>1</bitWidth></field></fields>
        </register>
        <register>
          <name>ODR</name><description>Port output data register</description><addressOffset>0x14</addressOffset>
          <fields><field><dim>16</dim><dimIncrement>1</dimIncrement><name>OD%s</name><description>Port output data</description><bitOffset>0</bitOffset><bitWidth>1</bitWidth></field></fields>
        </register>
        <register>
          <name>BSRR</name><description>Port bit set/reset register</description><addressOffset>0x18</addressOffset><access>write-only</access>
          <fields>
            <field><dim>16</dim><dimIncrement>1</dimIncrement><name>BR%s</name><description>Port reset bit</description><bitOffset>16</bitOffset><bitWidth>1</bitWidth></field>
            <field><dim>16</dim><dimIncrement>1</dimIncrement><name>BS%s</name><description>Port set bit</description><bitOffset>0</bitOffset><bitWidth>1</bitWidth></field>
          </fields>
        </register>
      </registers>
    </peripheral>
    <peripheral derivedFrom="GPIOA">
      <name>GPIOB</name>
      <description>General-purpose I/O port B</description>
      <baseAddress>0x48000400</baseAddress>
    </peripheral>
    <peripheral>
      <name>ADC1</name>
      <description>Analog-to-digital converter</description>
      <groupName>ADC</groupName>
      <baseAddress>0x50040000</baseAddress>
      <interrupt><name>ADC1_2</name><description>ADC1 and ADC2 global interrupt</description><value>18</value></interrupt>
      <registers>
        <register>
          <name>CR</name><description>Control register</description><addressOffset>0x08</addressOffset><resetValue>0x20000000</resetValue>
          <fields>
            <field><name>ADEN</name><description>ADC enable</description><bitOffset>0</bitOffset><bitWidth>1</bitWidth></field>
            <field><name>ADDIS</name><description>ADC disable</description><bitOffset>1</bitOffset><bitWidth>1</bitWidth></field>
            <field><name>ADSTART</name><description>ADC start of regular conversion</description><bitOffset>2</bitOffset><bitWidth>1</bitWidth></field>
            <field><name>ADVREGEN</name><description>ADC voltage regulator enable</description><bitOffset>28</bitOffset><bitWidth>1</bitWidth></field>
            <field><name>DEEPPWD</name><description>Deep-power-down enable</description><bitOffset>29</bitOffset><bitWidth>1</bitWidth></field>
            <field><name>ADCAL</name><description>ADC calibration</description><bitOffset>31</bitOffset><bitWidth>1</bitWidth></field>
          </fields>
        </register>
        <register>
          <name>CFGR</name><description>Configuration register</description><addressOffset>0x0C</addressOffset><resetValue>0x80000000</resetValue>
          <fields>
            <field><name>RES</name><description>Data resolution</description><bitOffset>3</bitOffset><bitWidth>2</bitWidth>
              <enumeratedValues>
                <enumeratedValue><name>RESOLUTION_12B</name><description>12-bit resolution</description><value>0</value></enumeratedValue>
                <enumeratedValue><name>RESOLUTION_10B</name><description>10-bit resolution</description><value>1</value></enumeratedValue>
                <enumeratedValue><name>RESOLUTION_8B</name><description>8-bit resolution</description><value>2</value></enumeratedValue>
                <enumeratedValue><name>RESOLUTION_6B</name><description>6-bit resolution</description><value>3</value></enumeratedValue>
              </enumeratedValues>
            </field>
            <field><name>ALIGN</name><description>Data alignment</description><bitOffset>5</bitOffset><bitWidth>1</bitWidth></field>
            <field><name>CONT</name><description>Single or continuous conversion mode</description><bitOffset>13</bitOffset><bitWidth>1</bitWidth></field>
            <field><name>JQDIS</name><description>Injected queue disable</description><bitOffset>31</bitOffset><bitWidth>1</bitWidth></field>
          </fields>
        </register>
        <cluster>
          <name>COMMON</name><description>Registers shared by ADC1 and ADC2</description><addressOffset>0x300</addressOffset>
          <register>
            <name>CSR</name><description>Common status register</description><addressOffset>0x00</addressOffset><access>read-only</access>
            <fields>
              <field><name>ADRDY_MST</name><description>Master ADC ready</description><bitOffset>0</bitOffset><bitWidth>1</bitWidth></field>
              <field><name>EOC_MST</name><description>End of regular conversion of the master ADC</description><bitOffset>2</bitOffset><bitWidth>1</bitWidth></field>
            </fields>
          </register>
          <register>
            <name>CCR</name><description>Common control register</description><addressOffset>0x08</addressOffset>
            <fields>
              <field><name>PRESC</name><description>ADC prescaler</description><bitOffset>18</bitOffset><bitWidth>4</bitWidth>
                <enumeratedValues>
                  <enumeratedValue><name>DIV1</name><description>Input clock not divided</description><value>0</value></enumeratedValue>
                  <enumeratedValue><name>DIV2</name><description>Input clock divided by 2</description><value>1</value></enumeratedValue>
                  <enumeratedValue><name>DIV4</name><description>Input clock divided by 4</description><value>2</value></enumeratedValue>
                  <enumeratedValue><name>DIV256</name><description>Input clock divided by 256</description><value>11</value></enumeratedValue>
                </enumeratedValues>
              </field>
              <field><name>VREFEN</name><description>VREFINT enable</description><bitOffset>22</bitOffset><bitWidth>1</bitWidth></field>
              <field><name>TSEN</name><description>Temperature sensor enable</description><bitOffset>23</bitOffset><bitWidth>1</bitWidth></field>
            </fields>
          </register>
        </cluster>
      </registers>
    </peripheral>
  </peripherals>
</device>
</script>
</body>
</html>
