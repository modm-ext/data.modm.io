<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peripheral Variant Explorer</title>
<meta name="description" content="How many different silicon implementations of each STM32 peripheral exist: the register maps of every peripheral instance of every device merged into a common core and its optional features.">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="variant-view.css">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>

<body class="app" data-page="variants">
<nav class="site" aria-label="modm-data pages"></nav>

<header class="top">
  <div>
    <h1>Peripheral Variants</h1>
    <p class="sub">Register maps of every STM32 peripheral instance, merged into variants with a common core and optional features</p>
  </div>
  <div class="totals">
    <div class="total"><b id="t-instances">–</b><span>instances</span></div>
    <div class="total"><b id="t-shapes">–</b><span>register maps</span></div>
    <div class="total"><b id="t-variants">–</b><span>variants</span></div>
  </div>
</header>

<div class="shell">
  <nav class="panel" aria-label="Peripheral groups">
    <div class="side-head">
      <div class="modes" id="modes" role="group" aria-label="Compatibility mode">
        <button type="button" data-mode="binary" aria-pressed="true">binary<span>by address</span></button>
        <button type="button" data-mode="source" aria-pressed="false">source<span>by name</span></button>
        <button type="button" data-mode="similar" aria-pressed="false">similar<span>docs aside</span></button>
      </div>
      <div class="search"><span class="delim" aria-hidden="true">/</span><input id="filter" type="search" placeholder="filter groups, e.g. ^(TIM|GPIO)" aria-label="Filter peripheral groups by regular expression" autocomplete="off" spellcheck="false"><span class="delim" aria-hidden="true">/i</span></div>
      <div class="search"><span class="delim" aria-hidden="true">/</span><input id="device" type="search" placeholder="highlight a device, e.g. F407" aria-label="Highlight the variants used by a device, by regular expression" autocomplete="off" spellcheck="false"><span class="delim" aria-hidden="true">/i</span></div>
    </div>
    <div class="side-list" id="groups"></div>
  </nav>

  <main class="panel main" id="main">
    <div class="main-head">
      <h2 id="g-name">Loading…</h2>
      <p id="g-sub"></p>
    </div>
    <div class="variants" id="tabs"></div>
    <div class="body" id="detail"></div>
  </main>
</div>
</body>
</html>
